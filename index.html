<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BAK Professional - Enterprise Incident Report System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f172a;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .panel {
            background: #1e293b;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }

        .panel h2 {
            color: #3b82f6;
            margin-bottom: 16px;
            font-size: 20px;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        label {
            display: block;
            margin-top: 14px;
            margin-bottom: 4px;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            transition: 0.2s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
        }

        textarea#ai_out {
            min-height: 400px;
            font-family: 'Courier New', 'SF Mono', monospace;
            font-size: 13px;
            line-height: 1.6;
            border: 2px solid #3b82f6;
            background: #070b14;
            resize: vertical;
        }

        .flex-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .flex-row > div {
            flex: 1;
            min-width: 150px;
        }

        .btn {
            padding: 14px 20px;
            border-radius: 40px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            font-size: 16px;
            transition: 0.2s;
        }

        .btn-blue {
            background: #2563eb;
            color: white;
        }
        
        .btn-blue:hover {
            background: #1d4ed8;
            transform: scale(0.98);
        }

        .btn-green {
            background: #10b981;
            color: white;
        }
        
        .btn-green:hover {
            background: #059669;
            transform: scale(0.98);
        }

        .file-status {
            font-size: 12px;
            margin-top: 8px;
            color: #10b981;
            font-weight: 500;
        }

        /* TTD CANVAS ENTERPRISE */
        .sig-container {
            background: #0f172a;
            border-radius: 16px;
            padding: 12px;
            margin-top: 12px;
            border: 1px solid #334155;
        }

        .sig-canvas-wrapper {
            background: white;
            border-radius: 12px;
            border: 2px solid #cbd5e1;
            cursor: crosshair;
            overflow: hidden;
        }

        .ttd-canvas {
            display: block;
            width: 100%;
            height: 150px;
            background: white;
            border-radius: 10px;
            touch-action: none;
        }

        .sig-actions {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        .small-btn {
            padding: 8px 16px;
            font-size: 12px;
            background: #334155;
            border: none;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }

        .small-btn:hover {
            background: #475569;
            transform: translateY(-1px);
        }

        /* Foto Editor dengan Tombol Delete */
        .foto-item-editor {
            background: #0f172a;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid #334155;
            position: relative;
            transition: 0.2s;
        }

        .foto-preview {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 12px;
            background: #00000022;
        }

        .foto-keterangan textarea {
            font-size: 12px;
            min-height: 70px;
        }
        
        .delete-foto-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;

            width: auto;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .delete-foto-btn:hover {
            background: #b91c1c;
            transform: scale(0.97);
        }

        /* ========== PDF RENDER ENGINE (A4 + ANTI-POTONG) ========== */
        #pdf-area {
            position: absolute;
            left: -9999px;
            top: -9999px;
            display: block;
        }

        .pdf-render {
            width: 794px;
            background: white;
            color: black;
            padding: 50px 60px;
            font-family: 'Times New Roman', Times, serif;
            font-size: 12pt;
            line-height: 1.6;
            box-sizing: border-box;
        }

        .pdf-header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 3px double #000;

        }

        .pdf-header h1 {

        .pdf-logo {

            margin-bottom: 10px;

        }

        .pdf-section {
            margin: 20px 0;
        }

        .pdf-section-title {
            font-size: 12pt;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 12px;
            border-bottom: 1px solid #000;
            padding-bottom: 3px;
        }

        .pdf-content {
            text-align: justify;
            line-height: 1.6;
            white-space: pre-wrap;
            margin-bottom: 15px;
        }

        .pdf-foto-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;

        }

        .pdf-foto-item {
            border: 1px solid #000;

            text-align: center;
            background: #fff;
            page-break-inside: avoid;
            break-inside: avoid;

        /* PATCH WAJIB #1: ANTI TERPOTONG & STABIL MULTIPAGE */
        .pdf-foto-img {
            width: 100%;
            height: auto;
            max-height: 320px;
            object-fit: contain;
            display: block;
            margin: 0 auto 8px;
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .pdf-foto-keterangan {
            font-style: italic;
            font-size: 10pt;
            color: #000;
            text-align: left;
            white-space: pre-wrap;
            border-top: 1px solid #ccc;
            padding-top: 5px;

.pdf-foto-page {

    page-break-before: always;

        /* STRUKTUR TTD FORMAT A RESMI - DILINDUNGI */
        .ttd-format-a {

        }

        .ttd-space {

    display: flex;

}

        .ttd-sign-img {
    max-width: 180px;
    max-height: 70px;
    object-fit: contain;

    display: block;
    margin: 0 auto;

    left: auto;

}

        .ttd-line {

/* ================= MATRIX HEADER UI ================= */

.matrix-banner {

    width: 100%;

    margin-bottom: 24px;

    padding: 20px;

    background: #000000;

    border: 2px solid #00ff66;

    color: #00ff66;

    font-size: 28px;

    font-weight: bold;

}

.matrix-subtitle {

        /* MOBILE UX POLISH */

    </style>

<body>

<div class="matrix-banner">

    <div class="matrix-title">
        BERITA ACARA KEJADIAN SAPAM MEDED
    </div>

    <div class="matrix-subtitle">
        CREATED & ENGINEERED BY Mbah Pri
    </div>

</div>

<div class="container">
    <div class="panel">
        <h2>📋 1. DATA KEJADIAN (INCIDENT REPORT)</h2>
        
        <div class="flex-row">
            <div><label>Tanggal Kejadian</label><input type="date" id="tgl"></div>
            <div><label>Waktu</label><input type="time" id="jam"></div>
        </div>
        
        <div class="flex-row">
            <div><label>Pelapor (Pihak I)</label><input id="nama_p1" placeholder="Nama Lengkap Pelapor"></div>
            <div><label>Jabatan Pelapor</label><input id="jabatan_p1" placeholder="Jabatan / Divisi"></div>
        </div>
        
        <div class="flex-row">
            <div><label>Penerima Laporan (Pihak II)</label><input id="nama_p2" placeholder="Nama Penerima"></div>
            <div><label>Jabatan Penerima</label><input id="jabatan_p2" placeholder="Jabatan / Divisi"></div>
        </div>
        
        <div class="flex-row">
            <div><label>Nama Atasan (Mengetahui)</label><input id="nama_atasan" placeholder="Contoh: HRD Manager / Site Manager"></div>
            <div><label>Jabatan Atasan</label><input id="jabatan_atasan" placeholder="Contoh: Kepala Camp / Manajer Operasional"></div>
        </div>
        
        <div><label>Lokasi Kejadian</label><input id="lokasi" placeholder="Lokasi spesifik (Area, Gedung, Lantai)"></div>
        <div><label>Kronologi Singkat / Inti Masalah</label><textarea id="ket" style="height:80px" placeholder="Ceritakan kronologi awal, apa yang terjadi, siapa saja yang terlibat..."></textarea></div>
        
        <label>🏢 Upload Logo Perusahaan / Header (opsional)</label>
        <input type="file" id="headerLogo" accept="image/*">
        
        <label>📸 Upload Foto Bukti (Multiple - Dokumentasi kejadian)</label>
        <input type="file" id="fotoInput" accept="image/*" multiple>
        <div id="file-status" class="file-status"></div>
        
        <button onclick="buatPromptEnterprise()" class="btn btn-blue">🚀 GENERATE PROMPT ENTERPRISE & BUKA AI</button>
    </div>
    
    <div class="panel">
        <h2>✏️ 2. EDIT LAPORAN RESMI & LAMPIRAN</h2>
        <label>Hasil AI (ChatGPT/Gemini/Claude) - Edit bebas sesuai standar BAK</label>
        <textarea id="ai_out" placeholder="Tempel hasil generate dari AI disini, lalu edit secara profesional..."></textarea>
        
        <div id="fotoListEditor" style="margin-top: 20px;"></div>
        
        <div style="margin-top: 20px; background: #0f172a; border-radius: 16px; padding: 16px;">
            <h3 style="margin-bottom: 12px;">🖊️ TANDA TANGAN DIGITAL (Klik & Drag di area putih)</h3>
            <div class="flex-row">
                <div style="flex:1">
                    <label>TTD Pelapor (Pihak I - Kiri / Pelapor)</label>
                    <div class="sig-container">
                        <div class="sig-canvas-wrapper">
                            <canvas id="canvasPelapor" class="ttd-canvas"></canvas>
                        </div>
                        <div class="sig-actions">
                            <button class="small-btn" onclick="clearCanvas('canvasPelapor')">✖️ Hapus TTD</button>
                        </div>
                    </div>
                </div>
                <div style="flex:1">
                    <label>TTD Penerima (Pihak II - Kanan / Penerima)</label>
                    <div class="sig-container">
                        <div class="sig-canvas-wrapper">
                            <canvas id="canvasPenerima" class="ttd-canvas"></canvas>
                        </div>
                        <div class="sig-actions">
                            <button class="small-btn" onclick="clearCanvas('canvasPenerima')">✖️ Hapus TTD</button>
                        </div>
                    </div>
                </div>
            </div>
            <button class="small-btn" onclick="clearAllCanvases()" style="margin-top: 12px;">🗑️ Hapus Semua Tanda Tangan</button>
            <p style="font-size:11px; margin-top:10px; color:#94a3b8;">✨ Support mouse & touch (Android/HP) | Gambar langsung untuk dokumen resmi BAK.</p>
        </div>
        
        <button onclick="unduhPDF()" class="btn btn-green">📄 DOWNLOAD PDF (FORMAT RESMI A4 - BAK PERUSAHAAN)</button>
    </div>
</div>

<div id="pdf-area"></div>

<script>
    // ==================== GLOBAL CORE VARIABLES (PRESERVE ENGINE) ====================
    let fotoDataList = []; 
    let headerLogoData = null;
    
    let drawingPelapor = false;
    let drawingPenerima = false;
    let ctxPelapor, ctxPenerima;
    let canvasPelapor, canvasPenerima;
    
    document.getElementById('tgl').value = new Date().toISOString().slice(0,10);
    document.getElementById('jam').value = new Date().toTimeString().slice(0,5);
    
    // ========== TTD ENGINE ==========
    function initTTDCanvas() {
        canvasPelapor = document.getElementById('canvasPelapor');
        canvasPenerima = document.getElementById('canvasPenerima');
        
        if(canvasPelapor) {
            canvasPelapor.width = 400;
            canvasPelapor.height = 150;
            ctxPelapor = canvasPelapor.getContext('2d');
            resetCanvasContext(ctxPelapor, canvasPelapor);
            
            canvasPelapor.addEventListener('mousedown', (e) => { drawingPelapor = true; draw(e, ctxPelapor, canvasPelapor); });
            canvasPelapor.addEventListener('mousemove', (e) => { if(drawingPelapor) draw(e, ctxPelapor, canvasPelapor); });
            canvasPelapor.addEventListener('mouseup', () => { drawingPelapor = false; ctxPelapor.beginPath(); });
            canvasPelapor.addEventListener('mouseleave', () => { drawingPelapor = false; ctxPelapor.beginPath(); });
            
            canvasPelapor.addEventListener('touchstart', (e) => { drawingPelapor = true; draw(e, ctxPelapor, canvasPelapor); e.preventDefault(); });
            canvasPelapor.addEventListener('touchmove', (e) => { if(drawingPelapor) draw(e, ctxPelapor, canvasPelapor); e.preventDefault(); });
            canvasPelapor.addEventListener('touchend', () => { drawingPelapor = false; ctxPelapor.beginPath(); });
        }
        
        if(canvasPenerima) {
            canvasPenerima.width = 400;
            canvasPenerima.height = 150;
            ctxPenerima = canvasPenerima.getContext('2d');
            resetCanvasContext(ctxPenerima, canvasPenerima);
            
            canvasPenerima.addEventListener('mousedown', (e) => { drawingPenerima = true; draw(e, ctxPenerima, canvasPenerima); });
            canvasPenerima.addEventListener('mousemove', (e) => { if(drawingPenerima) draw(e, ctxPenerima, canvasPenerima); });
            canvasPenerima.addEventListener('mouseup', () => { drawingPenerima = false; ctxPenerima.beginPath(); });
            canvasPenerima.addEventListener('mouseleave', () => { drawingPenerima = false; ctxPenerima.beginPath(); });
            
            canvasPenerima.addEventListener('touchstart', (e) => { drawingPenerima = true; draw(e, ctxPenerima, canvasPenerima); e.preventDefault(); });
            canvasPenerima.addEventListener('touchmove', (e) => { if(drawingPenerima) draw(e, ctxPenerima, canvasPenerima); e.preventDefault(); });
            canvasPenerima.addEventListener('touchend', () => { drawingPenerima = false; ctxPenerima.beginPath(); });
        }
    }

    function resetCanvasContext(ctx, canvas) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
    }
    
    function draw(e, ctx, canvas) {
        const rect = canvas.getBoundingClientRect();
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        const x = (clientX - rect.left) * (canvas.width / rect.width);
        const y = (clientY - rect.top) * (canvas.height / rect.height);
        
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
    }
    
    function clearCanvas(canvasId) {
        if(canvasId === 'canvasPelapor' && ctxPelapor) resetCanvasContext(ctxPelapor, canvasPelapor);
        if(canvasId === 'canvasPenerima' && ctxPenerima) resetCanvasContext(ctxPenerima, canvasPenerima);
    }
    
    function clearAllCanvases() {
        clearCanvas('canvasPelapor');
        clearCanvas('canvasPenerima');
    }
    
    window.addEventListener('load', initTTDCanvas);
    
    // File Header Logo
    document.getElementById('headerLogo').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if(file) {
            const reader = new FileReader();
            reader.onload = (ev) => { headerLogoData = ev.target.result; };
            reader.readAsDataURL(file);
        }
    });
    
    // Upload foto & binding delete foto per item (PATCH WAJIB #2)
    document.getElementById('fotoInput').addEventListener('change', function(e) {
        const files = Array.from(e.target.files);
        if(files.length === 0) return;


if(fotoDataList.length >= 20){
    alert(
        "⚠️ Foto sangat banyak.\n\n" +
        "PDF mungkin lebih berat tergantung RAM HP Android."
    );
}
        
        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (ev) => {

    const img = new Image();

    img.onload = function () {

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        let width = img.width;
        let height = img.height;

        // BATAS MAKSIMUM AGAR ANDROID TETAP RINGAN
        const MAX_WIDTH = 1600;
        const MAX_HEIGHT = 1600;

        // AUTO RESIZE LANDSCAPE / PORTRAIT
        if (width > height) {

            if (width > MAX_WIDTH) {
                height *= MAX_WIDTH / width;
                width = MAX_WIDTH;
            }

        } else {

            if (height > MAX_HEIGHT) {
                width *= MAX_HEIGHT / height;
                height = MAX_HEIGHT;
            }
        }

        canvas.width = width;
        canvas.height = height;

        ctx.drawImage(img, 0, 0, width, height);

        // COMPRESS JPEG AGAR PDF TIDAK BERAT
        const compressedData = canvas.toDataURL(
            'image/jpeg',
            0.82
        );

        fotoDataList.push({
            dataURL: compressedData,
            nama: file.name,
            keterangan: ''
        });

        renderFotoEditor();

        document.getElementById('file-status').innerText =
            `${fotoDataList.length} foto bukti siap (compressed & optimized)`;
    };

    img.src = ev.target.result;
};

reader.readAsDataURL(file);
        });

        e.target.value = '';
    });
    
    // PATCH: DELETE FOTO PER ITEM DENGAN CONFIRM
    function hapusFoto(index) {
        if(confirm(`Hapus foto bukti ini dari laporan? Data akan dihapus secara permanen.`)) {
            fotoDataList.splice(index, 1);
            renderFotoEditor();
            document.getElementById('file-status').innerText = fotoDataList.length ? `${fotoDataList.length} foto bukti tersisa` : "Tidak ada foto. Upload bukti.";
        }
    }
    
    function renderFotoEditor() {
        const container = document.getElementById('fotoListEditor');
        let html = '<label>📝 KETERANGAN FOTO BUKTI (LAMPIRAN RESMI)</label>';
        fotoDataList.forEach((foto, idx) => {
            html += `
                <div class="foto-item-editor">
                    <img src="${foto.dataURL}" class="foto-preview" alt="foto bukti">
                    <div class="foto-keterangan">
                        <textarea placeholder="Keterangan foto: jelaskan isi, waktu, atau bukti dari foto ini..." id="keterangan_foto_${idx}" rows="3">${escapeHtml(foto.keterangan)}</textarea>
                    </div>
                    <button class="delete-foto-btn" onclick="hapusFoto(${idx})">🗑️ Hapus Foto</button>
                </div>
            `;
        });
        container.innerHTML = html;
        fotoDataList.forEach((_, idx) => {
            const ta = document.getElementById(`keterangan_foto_${idx}`);
            if(ta) ta.addEventListener('input', (e) => { fotoDataList[idx].keterangan = e.target.value; });
        });
    }
    
    function escapeHtml(str) { 
        if(!str) return ''; 
        return str.replace(/[&<>]/g, m => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[m])); 
    }

    // ========== ENGINE PDF UTAMA (PRESERVE SEMUA STRUKTUR) ==========
    async function unduhPDF() {
        const laporanText = document.getElementById('ai_out').value;
        if(!laporanText.trim()) { alert("⚠️ WAJIB: Isi atau paste teks laporan hasil AI terlebih dahulu!"); return; }
        
        // Capture TTD Canvas (Kosong jika tidak digambar)
        let ttdPelaporBase64 = null;
        let ttdPenerimaBase64 = null;
        
        if(canvasPelapor && ctxPelapor) {
            const buffer = ctxPelapor.getImageData(0, 0, canvasPelapor.width, canvasPelapor.height);
            let isChanged = false;
            for (let i = 0; i < buffer.data.length; i += 4) {
                if (buffer.data[i] !== 255 || buffer.data[i+1] !== 255 || buffer.data[i+2] !== 255) {
                    isChanged = true; break;
                }
            }
            if(isChanged) ttdPelaporBase64 = canvasPelapor.toDataURL("image/png");
        }
        
        if(canvasPenerima && ctxPenerima) {
            const buffer = ctxPenerima.getImageData(0, 0, canvasPenerima.width, canvasPenerima.height);
            let isChanged = false;
            for (let i = 0; i < buffer.data.length; i += 4) {
                if (buffer.data[i] !== 255 || buffer.data[i+1] !== 255 || buffer.data[i+2] !== 255) {
                    isChanged = true; break;
                }
            }
            if(isChanged) ttdPenerimaBase64 = canvasPenerima.toDataURL("image/png");
        }
        
        const namaPelapor = document.getElementById('nama_p1').value || "...........................";
        const jabatanPelapor = document.getElementById('jabatan_p1').value || "Pelapor";
        const namaPenerima = document.getElementById('nama_p2').value || "...........................";
        const jabatanPenerima = document.getElementById('jabatan_p2').value || "Penerima Laporan";
        const namaAtasan = document.getElementById('nama_atasan').value || "...........................";
        const jabatanAtasan = document.getElementById('jabatan_atasan').value || "Atasan / Mengetahui";
        
        // Lampiran foto dengan anti-potong + page-break-inside
        let fotoHtml = '';

if (fotoDataList.length > 0) {

    fotoDataList.forEach((foto, index) => {

        let ket = foto.keterangan || '(Tanpa keterangan)';

        fotoHtml += `

        <div class="pdf-foto-page">

            <div class="pdf-foto-page-title">
                LAMPIRAN FOTO DOKUMENTASI ${index + 1}
            </div>

            <div class="pdf-foto-center-wrapper">

                <img 
                    src="${foto.dataURL}" 
                    class="pdf-foto-single"
                    crossorigin="anonymous"
                >

                <div class="pdf-foto-single-keterangan">
                    <b>Keterangan Bukti:</b><br><br>
                    ${escapeHtml(ket).replace(/\n/g, '<br>')}
                </div>

            </div>

        </div>

        `;
    });
}
        
        // TTD STRUCTURE PROFESIONAL (PRESERVE FORMAT A)
        const ttdHtml = `
            <div class="pdf-section">
                <div class="pdf-section-title">III. PENGESAHAN</div>
                <table class="ttd-table">
                    <tr>
                        <td>
                            <div class="ttd-box">
                                <div><b>Pihak I (Pelapor)</b></div>
                                <div class="ttd-space">
                                    ${ttdPelaporBase64 ? `<img src="${ttdPelaporBase64}" class="ttd-sign-img">` : ''}
                                </div>
                                <div class="ttd-line"></div>
                                <div class="ttd-nama">${namaPelapor}</div>
                                <div class="ttd-jabatan">${jabatanPelapor}</div>
                            </div>
                        </td>
                        <td>
                            <div class="ttd-box">
                                <div><b>Pihak II (Penerima)</b></div>
                                <div class="ttd-space">
                                    ${ttdPenerimaBase64 ? `<img src="${ttdPenerimaBase64}" class="ttd-sign-img">` : ''}
                                </div>
                                <div class="ttd-line"></div>
                                <div class="ttd-nama">${namaPenerima}</div>
                                <div class="ttd-jabatan">${jabatanPenerima}</div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" style="text-align: center; padding-top: 30px;">
                            <div class="ttd-box" style="width: 50%; margin: 0 auto;">
                                <div><b>Mengetahui,</b></div>
                                <div class="ttd-space"></div>
                                <div class="ttd-line"></div>
                                <div class="ttd-nama">${namaAtasan}</div>
                                <div class="ttd-jabatan">${jabatanAtasan}</div>
                            </div>
                        </td>
                    </tr>
                </table>
            </div>
        `;
        
        const headerLogoHtml = headerLogoData ? `<img src="${headerLogoData}" class="pdf-logo">` : '';
        const fullPdfHtml = `
            <div class="pdf-render" id="render-target">
                <div class="pdf-header">
                    ${headerLogoHtml}
                    <h1>BERITA ACARA KEJADIAN (BAK)</h1>
                    <div class="nomor-bak">No. BAK/${new Date().getFullYear()}/SEC/${Math.floor(1000 + Math.random() * 9000)}</div>
                </div>
                <div class="pdf-section">
                    <div class="pdf-section-title">I. LAPORAN RESMI KEJADIAN</div>
                    <div class="pdf-content">${laporanText.replace(/\n/g, '<br>')}</div>
                </div>
                ${ttdHtml}
                ${fotoHtml}
            </div>
        `;
        
        const pdfArea = document.getElementById('pdf-area');
        pdfArea.innerHTML = fullPdfHtml;
        const targetElement = document.getElementById('render-target');
        
        try {
            const canvas = await html2canvas(targetElement, {
                scale: 2.2,
                useCORS: true,
                logging: false,
                backgroundColor: '#ffffff',
                onclone: (clonedDoc, element) => {}
            });
            
            const imgData = canvas.toDataURL('image/jpeg', 1.0);
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = pdf.internal.pageSize.getHeight();
            
            const canvasWidth = canvas.width;
            const canvasHeight = canvas.height;
            const imgHeightInMm = (canvasHeight * pdfWidth) / canvasWidth;
            
            let heightLeft = imgHeightInMm;
            let position = 0;
            
            pdf.addImage(imgData, 'JPEG', 0, position, pdfWidth, imgHeightInMm, undefined, 'FAST');
            heightLeft -= pdfHeight;
            
            while (heightLeft > 0) {
                position = heightLeft - imgHeightInMm;
                if(Math.abs(position) < imgHeightInMm - 1) {
                    pdf.addPage();
                    pdf.addImage(imgData, 'JPEG', 0, position, pdfWidth, imgHeightInMm, undefined, 'FAST');
                }
                heightLeft -= pdfHeight;
            }
            
            const fileDate = document.getElementById('tgl').value || new Date().toISOString().slice(0,10);
            pdf.save(`BAK_RESMI_${namaPelapor.replace(/[^a-z0-9]/gi, '_')}_${fileDate}.pdf`);
        } catch(err) {
            alert("Error generating PDF: " + err.message);
            console.error(err);
        } finally {
            pdfArea.innerHTML = '';
        }
    }
</script>
